<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>lchat</title>
<style>
/* palette: Obsidian-like (purple accent, soft greys); dark by default when the OS is dark */
:root{--bg:#ffffff;--side:#f6f6f7;--panel:#ffffff;--fg:#1f1f23;--mut:#7c7c86;--line:#e4e4e8;--acc:#7c5cff;--acc2:#6a4bf0;--me:#f1effe;--code:#f4f4f6;--hover:#ececf0;--ok:#2e9d5b;--bad:#d04545;--warn:#c98a00;--shadow:0 8px 30px rgba(0,0,0,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1e20;--side:#18181a;--panel:#232326;--fg:#dcdce0;--mut:#8d8d96;--line:#303036;--acc:#9a80ff;--acc2:#8b6dff;--me:#2c2840;--code:#2a2a2e;--hover:#26262a;--ok:#5cc08a;--bad:#e06060;--warn:#e0a84a;--shadow:0 8px 30px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#1e1e20;--side:#18181a;--panel:#232326;--fg:#dcdce0;--mut:#8d8d96;--line:#303036;--acc:#9a80ff;--acc2:#8b6dff;--me:#2c2840;--code:#2a2a2e;--hover:#26262a;--ok:#5cc08a;--bad:#e06060;--warn:#e0a84a;--shadow:0 8px 30px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
input[type=checkbox]{accent-color:var(--acc)}
#app{display:flex;height:100%}
/* ---- sidebar ---- */
#side{width:268px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:margin-left .2s}
#app.collapsed #side{margin-left:-268px}
#side .top{display:flex;align-items:center;gap:8px;padding:12px 12px 8px}
#side .brand{font-weight:700;font-size:15px;letter-spacing:.2px;flex:1;display:flex;align-items:center;gap:8px}
#side .brand i{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--acc),#c45cff);display:inline-block}
.ibtn{background:none;border:0;border-radius:8px;width:32px;height:32px;cursor:pointer;color:var(--mut);display:inline-grid;place-items:center;font-size:16px}
.ibtn:hover{background:var(--hover);color:var(--fg)}
#newBtn{margin:4px 12px 10px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600}
#newBtn:hover{border-color:var(--acc)}
#search{margin:0 12px 8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;outline:0}
#search:focus{border-color:var(--acc)}
#chatList{flex:1;overflow-y:auto;padding:0 8px 8px;font-size:13.5px}
#chatList .grp{color:var(--mut);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin:12px 8px 4px}
#chatList .row{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;cursor:pointer}
#chatList .row:hover{background:var(--hover)}
#chatList .row.cur{background:color-mix(in srgb,var(--acc) 16%,transparent)}
#chatList .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chatList .x{visibility:hidden;border:0;background:none;color:var(--mut);cursor:pointer;font-size:15px;padding:0 2px}
#chatList .row:hover .x{visibility:visible}
#chatList .empty{color:var(--mut);padding:8px}
#issuesNav[hidden]{display:none}
#issuesBadge{background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;font-weight:700}
#issuesBadge[hidden]{display:none}
#side .bottom{border-top:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:4px;font-size:12px;color:var(--mut)}
#side .bottom #model{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---- main ---- */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#bar{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:13px;color:var(--mut)}
#bar .title{font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50vw}
#bar .sp{flex:1}
.pill{font-size:12px;border:1px solid var(--line);border-radius:20px;padding:2px 10px;cursor:pointer;user-select:none}
.pill.on{border-color:color-mix(in srgb,var(--acc) 60%,transparent);color:var(--acc)}
#log{flex:1;overflow-y:auto;padding:8px 16px 24px}
#log>*{max-width:780px;margin-left:auto;margin-right:auto}
.msg{margin:0 auto 22px}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .body{background:var(--me);padding:10px 16px;border-radius:18px 18px 4px 18px;max-width:80%;white-space:pre-wrap;word-wrap:break-word}
.msg.user img{max-width:220px;max-height:180px;border-radius:10px;display:block;margin-bottom:6px}
.msg.asst{position:relative;padding-left:40px}
.msg.asst::before{content:'';position:absolute;left:0;top:2px;width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--acc),#c45cff)}
.msg.asst .body{padding:2px 0;word-wrap:break-word}
.msg.asst .body:empty{display:none}
.body p{margin:0 0 .8em}.body p:last-child{margin-bottom:0}
.body pre{background:var(--code);padding:12px 14px;border-radius:10px;overflow-x:auto;font-size:13px;border:1px solid var(--line)}
.body code{background:var(--code);padding:1px 5px;border-radius:5px;font-size:.9em;font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;color:color-mix(in srgb,var(--acc) 70%,var(--fg))}
.body pre code{background:none;padding:0;color:inherit}
.body ul,.body ol{margin:0 0 .8em;padding-left:1.4em}
.body h3{font-size:1.08em;margin:1em 0 .4em}
.body b{font-weight:650}
details.think{color:var(--mut);font-size:13px;margin:4px 0 8px;border-left:2px solid color-mix(in srgb,var(--acc) 40%,var(--line));padding-left:12px}
details.think summary{cursor:pointer;user-select:none}
details.think div{white-space:pre-wrap}
/* tool calls as Obsidian-style callouts */
.tool{border:1px solid var(--line);border-left:3px solid var(--acc);background:color-mix(in srgb,var(--acc) 5%,var(--panel));border-radius:8px;margin:8px 0;font-size:13px;overflow:hidden}
.tool .hd{display:flex;gap:8px;align-items:center;padding:7px 12px;cursor:pointer;user-select:none}
.tool .hd::before{content:'›';color:var(--mut);transition:transform .15s;display:inline-block}
.tool.open .hd::before{transform:rotate(90deg)}
.tool .nm{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-weight:600;color:var(--acc)}
.tool .sum{flex:1;color:var(--mut);font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool .st{font-size:12px}
.tool .st.run{color:var(--warn)}.tool .st.ok{color:var(--ok)}.tool .st.err{color:var(--bad)}
.tool .bd{display:none;border-top:1px solid var(--line);padding:8px 12px}
.tool.open .bd{display:block}
.tool pre{margin:0 0 6px;background:var(--code);padding:8px 10px;border-radius:6px;white-space:pre-wrap;word-break:break-word;max-height:360px;overflow:auto;font-size:12px}
.tool img{max-width:100%;border-radius:6px;display:block}
.tool.asking{border-left-color:var(--warn)}
.tool.asking pre.args{max-height:none}
.tool .ask{display:flex;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 12px;cursor:pointer}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.meta{font-size:12px;color:var(--mut);margin-top:6px}
p.dim{color:var(--mut);font-size:12px;margin:4px 0}
.phases{list-style:none;margin:8px 0 0;padding:0;font-size:12px;color:var(--mut);font-family:"JetBrains Mono",ui-monospace,monospace}.phases li{margin:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.phases li::before{display:inline-block;width:1.4em}.phases li.run{color:var(--warn)}.phases li.run::before{content:'●';animation:pulse 1s ease-in-out infinite}.phases li.ok::before{content:'✓';color:var(--ok)}.phases li.err::before{content:'✕';color:var(--bad)}.phases li.skip::before{content:'–'}.phases li.retry{color:var(--acc)}.phases li.retry::before{content:'↻'}
.state{font-size:12px;margin-top:6px;font-weight:600}.state.run{color:var(--warn)}.state.run::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:6px;animation:pulse 1s ease-in-out infinite}.state.ok{color:var(--ok)}.state.err{color:var(--bad)}.state.stop{color:var(--mut)}
@keyframes pulse{50%{opacity:.25}}
.err{color:var(--bad)}
/* empty chat */
#hello{text-align:center;padding:12vh 0 0}
#hello h1{font-size:28px;font-weight:650;margin:0 0 6px}
#hello p{color:var(--mut);margin:0 0 22px;font-size:14px}
#hello .chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;max-width:640px;margin:0 auto;text-align:left}
#hello .chip{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:13.5px}
#hello .chip:hover{border-color:var(--acc)}
#hello .chip b{display:block;font-size:13px}
#hello .chip span{color:var(--mut);font-size:12.5px}
/* composer */
footer{padding:0 16px 14px}
footer>*{max-width:780px;margin-left:auto;margin-right:auto}
#att{display:flex;gap:6px;margin-bottom:6px}
#att .a{position:relative}#att img{height:54px;border-radius:8px;display:block}
#att .a span{position:absolute;top:-6px;right:-6px;background:var(--fg);color:var(--bg);border-radius:50%;width:18px;height:18px;font-size:12px;text-align:center;line-height:18px;cursor:pointer}
#box{display:flex;gap:6px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:8px 8px 8px 10px;box-shadow:var(--shadow)}
#box:focus-within{border-color:color-mix(in srgb,var(--acc) 60%,var(--line))}
#box.drag{border-color:var(--acc)}
#in{flex:1;border:0;outline:0;background:none;resize:none;max-height:40vh;min-height:24px;padding:6px 4px}
#send{background:var(--acc);color:#fff;border:0;border-radius:16px;padding:7px 16px;cursor:pointer;font-weight:600}
#send:hover{background:var(--acc2)}
#send.stop{background:var(--bad)}
#clip{border-radius:16px}
#file{display:none}
.hint{font-size:11.5px;color:var(--mut);text-align:center;margin-top:6px}
/* settings modal */
#settings{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;align-items:center;justify-content:center;padding:16px}
#settings.open{display:flex}
#settings .dlg{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(560px,100%);max-height:90vh;overflow:auto;padding:18px 20px;display:flex;flex-wrap:wrap;gap:12px 18px;font-size:13.5px}
#settings h2{font-size:16px;margin:0;flex:1}
#settings label{display:flex;gap:6px;align-items:center}
#settings .full{width:100%;flex-direction:column;align-items:stretch}
#settings textarea{width:100%;min-height:70px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
#settings input[type=number]{width:76px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
#settings .sys{width:100%;color:var(--mut);font-size:12px;background:var(--code);border-radius:8px;padding:8px 10px}
#toolset{display:flex;gap:4px 12px;flex-wrap:wrap;width:100%;color:var(--mut)}
#toolset label{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:12px}
#scrim{display:none}
/* phones: the sidebar slides over the chat */
@media (max-width:760px){
  #side{position:fixed;z-index:15;top:0;bottom:0;left:0;box-shadow:var(--shadow)}
  #app:not(.sideopen) #side{margin-left:-268px}
  #app.sideopen #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:14}
  .msg.asst{padding-left:0}.msg.asst::before{display:none}
  .msg.user .body{max-width:92%}
}
/* issues */
#issuesNav{border-top:1px solid var(--line);padding:6px 8px 8px;font-size:13px;max-height:38%;overflow-y:auto;flex:none}
#issuesNav .ihd{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin:6px 8px 4px;cursor:pointer;user-select:none}
#issuesNav .ihd .n{margin-left:auto;text-transform:none;font-weight:500}
#issuesNav.fold .irow,#issuesNav.fold .imore{display:none}
#issuesNav .irow{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:8px;cursor:pointer}
#issuesNav .irow:hover{background:var(--hover)}
#issuesNav .irow.cur{background:color-mix(in srgb,var(--acc) 16%,transparent)}
#issuesNav .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--warn)}
#issuesNav .dot.error{background:var(--bad)}
#issuesNav .irow.seen .dot,#issuesNav .irow.background .dot{opacity:.45}
#issuesNav .irow.new .it{font-weight:600}
#issuesNav .it{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#issuesNav .ic{color:var(--mut);font-size:11.5px;flex:none}
#issuesNav .ia{display:none;gap:2px;flex:none}
#issuesNav .irow:hover .ia{display:flex}
#issuesNav .irow:hover .ic{display:none}
#issuesNav .ia button{border:0;background:none;color:var(--mut);cursor:pointer;padding:0 3px;font-size:13px;border-radius:5px}
#issuesNav .ia button:hover{color:var(--fg);background:var(--line)}
#issuesNav .imore{color:var(--mut);font-size:12px;padding:4px 8px;cursor:pointer}
#issuesNav .imore:hover{color:var(--fg)}
#issuesBadge{cursor:pointer}
/* tasks */
#tasksNav[hidden]{display:none}
#chatBar[hidden]{display:none}
/* sidebar list */
#tasksNav{border-top:1px solid var(--line);padding:6px 8px 8px;font-size:13px;max-height:38%;overflow-y:auto;flex:none}
#tasksNav .tkh{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin:6px 8px 4px;user-select:none}
#tasksNav .tkh .n{margin-left:auto;text-transform:none;font-weight:500}
#tasksNav .tkplus{width:22px;height:22px;font-size:15px;line-height:1}
#tasksNav .tkmut{color:var(--mut);font-size:12px;padding:2px 8px 4px}
#tasksNav .tkrow{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:8px;cursor:pointer}
#tasksNav .tkrow:hover{background:var(--hover)}
#tasksNav .tkrow.cur{background:color-mix(in srgb,var(--acc) 16%,transparent)}
#tasksNav .tkdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--mut)}
#tasksNav .tkdot.run{background:var(--acc);animation:tkpulse 1.1s ease-in-out infinite}
#tasksNav .tkdot.ok{background:var(--ok)}
#tasksNav .tkdot.bad{background:var(--bad)}
#tasksNav .tkdot.warn{background:var(--warn)}
#tasksNav .tkdot.paused{background:var(--mut)}
#tasksNav .tkdot.never{background:transparent;border:1.5px solid var(--mut)}
@keyframes tkpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}
#tasksNav .tkt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#tasksNav .tkw{color:var(--mut);font-size:11.5px;flex:none;white-space:nowrap}
#tasksNav .tkub{background:var(--acc);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;font-weight:700;flex:none}
#tasksNav .tkub[hidden]{display:none}
/* bar above a task thread */
#chatBar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:6px 14px;border-bottom:1px solid var(--line);background:var(--side);font-size:12.5px;color:var(--mut)}
#chatBar .cbi{flex:1 1 260px;min-width:0}
#chatBar .cbb{display:flex;gap:6px;flex-wrap:wrap}
#chatBar .btn{padding:2px 9px;font-size:12px}
#chatBar .btn:disabled{opacity:.5;cursor:default}
#chatBar .cbrun{color:var(--acc);font-weight:600}
#chatBar .cbx{border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:11.5px;color:var(--mut);white-space:nowrap}
#chatBar .cbx.read{color:var(--acc);border-color:var(--acc)}
#chatBar .cbx.full{color:var(--warn);border-color:var(--warn)}
#chatBar .cbn{flex-basis:100%;font-size:12px}
#chatBar .cbn.bad{color:var(--bad)}
/* New / Edit task dialog */
#taskDlg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:21;align-items:center;justify-content:center;padding:16px}
#taskDlg.open{display:flex}
#taskDlg .dlg{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(520px,100%);max-height:90vh;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px;font-size:13.5px}
#taskDlg .tkhd{display:flex;align-items:center;gap:6px}
#taskDlg .tkhd h2{flex:1;font-size:16px;margin:0}
#taskDlg .tkf{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;border:0;min-width:0}
#taskDlg .tkl,#taskDlg legend{color:var(--mut);font-size:12px;padding:0}
#taskDlg input:not([type=radio]),#taskDlg textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;outline:0}
#taskDlg input:not([type=radio]):focus,#taskDlg textarea:focus{border-color:var(--acc)}
#taskDlg textarea{min-height:90px;resize:vertical}
#taskDlg .tkchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
#taskDlg .tkch{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:2px 10px;font-size:12px;cursor:pointer;color:var(--mut)}
#taskDlg .tkch:hover{color:var(--fg);border-color:var(--mut)}
#taskDlg .tkprev{font-size:12px;min-height:16px;color:var(--mut)}
#taskDlg .tkprev .tkok{color:var(--fg)}
#taskDlg .tkprev.bad{color:var(--bad);white-space:pre-wrap}
#taskDlg .tkmut{color:var(--mut);font-size:12px}
#taskDlg .tkacc{border:1px solid var(--line);border-radius:10px;padding:8px 10px;gap:6px}
#taskDlg .tkacc label{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
#taskDlg .tkacc small{color:var(--mut);font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:11.5px}
#taskDlg .tkwarn{color:var(--warn);font-size:12.5px;border:1px solid var(--warn);border-radius:8px;padding:6px 9px}
#taskDlg .tkerr{color:var(--bad);font-size:12.5px;white-space:pre-wrap}
#taskDlg .tkfoot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#taskDlg .tkfoot .tkmut{margin-right:auto}
#taskDlg .btn:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="top"><span class="brand"><i></i>lchat <span id="issuesBadge" hidden></span></span>
      <button class="ibtn" id="sideBtn2" title="Close sidebar">⟨</button></div>
    <button id="newBtn">＋ New chat</button>
    <input id="search" placeholder="Search chats" autocomplete="off">
    <div id="chatList"></div>
    <section id="issuesNav" hidden></section>
    <section id="tasksNav" hidden></section>
    <div class="bottom"><span id="model">connecting…</span>
      <button class="ibtn" id="themeBtn" title="Light / dark">◐</button>
      <button class="ibtn" id="setBtn" title="Settings">⚙</button></div>
  </aside>
  <div id="scrim"></div>
  <main id="main">
    <div id="bar"><button class="ibtn" id="sideBtn" title="Sidebar">☰</button>
      <span class="title" id="chatTitle">New chat</span><span class="sp"></span>
      <span class="pill" id="cwdBtn" title="Working directory of this chat (bash runs here). Click to change.">📁 …</span>
      <span class="pill" id="agentPill" title="Agent mode: click to toggle">agent off</span></div>
    <div id="chatBar" hidden></div>
    <div id="log"></div>
    <footer>
      <div id="att"></div>
      <div id="box">
        <button class="ibtn" id="clip" title="Attach image">＋</button>
        <input type="file" id="file" accept="image/*" multiple>
        <textarea id="in" rows="1" placeholder="Ask anything" title="Enter to send, Shift+Enter for a new line, paste or drop images"></textarea>
        <button id="send">Send</button>
      </div>
      <div class="hint">Runs locally. Commands that change your system ask before they run.</div>
    </footer>
  </main>
  <div id="settings"><div class="dlg">
    <h2>Settings</h2><button class="ibtn" id="setClose" title="Close">✕</button>
    <div class="sys" id="sysInfo">System: …</div>
    <label class="full">System prompt (added to the agent prompt)<textarea id="sys"></textarea></label>
    <label><input type="checkbox" id="agent" checked> Agent (tools)</label>
    <label><input type="checkbox" id="auto"> Auto-approve risky tools</label>
    <label>Max steps <input type="number" id="steps" min="1" max="100"></label>
    <label><input type="checkbox" id="think" checked> Thinking</label>
    <label>Temp <input type="number" id="temp" step="0.05" min="0" max="2" placeholder="model"></label>
    <label>Max tokens <input type="number" id="maxt" min="1" placeholder="∞"></label>
    <div id="toolset"></div>
  </div></div>
</div>
<script>
const TOKEN=decodeURIComponent(location.hash.slice(1)); // token is only in the URL printed by lchat-web, never served
const $=s=>document.querySelector(s);
const log=$('#log'),inp=$('#in'),send=$('#send'),att=$('#att');
const SID=Math.random().toString(36).slice(2);
let curPhase=null;   // the running progress-list line of the current turn (see phase() in go)
const BASE_TITLE=document.title;document.addEventListener('visibilitychange',()=>{if(!document.hidden&&document.title.startsWith('✓ '))document.title=BASE_TITLE});
let msgs=[],imgs=[],ctrl=null,busy=false,TOOLS=[],CWD='',DEFAULT_DIR='',SYSINFO='',pendingAsks=[],VISION=true,NCTX=0,lastPrompt=0;
const S={get(k,d){try{return localStorage.getItem('lchat.'+k)??d}catch{return d}},set(k,v){try{localStorage.setItem('lchat.'+k,v)}catch{}}};

// ---------- working directory (per chat; the server keeps it per session = chat id) ----------
const shortPath=p=>String(p||'').replace(/^\/home\/[^\/]+/,'~').replace(/^\/Users\/[^\/]+/,'~');
function setCwd(d){CWD=d||CWD;const b=$('#cwdBtn');if(b){b.textContent='📁 '+(shortPath(CWD)||'~');b.title='Working directory of this chat: '+CWD+' (bash runs here). Click to change.'}}
$('#cwdBtn').onclick=async()=>{
  const v=prompt('Working directory for this chat (bash runs here):',CWD);if(!v||!v.trim())return;
  try{const r=await api('/api/cwd',{session:CHAT_ID,cwd:v.trim()});if(r.cwd)setCwd(r.cwd);else alert(r.error||'could not change directory')}
  catch(e){alert('could not change directory: '+e.message)}
};

// ---------- settings ----------
$('#sys').value=S.get('sys','');$('#temp').value=S.get('temp','');$('#maxt').value=S.get('maxt','');$('#steps').value=S.get('steps','20');
for(const id of['sys','temp','maxt','steps'])$('#'+id).oninput=e=>S.set(id,e.target.value);
for(const [id,def] of [['think','1'],['agent','1'],['auto','0']]){$('#'+id).checked=S.get(id,def)==='1';$('#'+id).onchange=e=>{S.set(id,e.target.checked?'1':'0');pill()}}
function pill(){const on=$('#agent').checked&&TOOLS.length;const p=$('#agentPill');p.textContent=on?(`agent · ${enabledTools().length} tools`+($('#auto').checked?' · auto':'')):'agent off';p.classList.toggle('on',!!on)}
$('#agentPill').onclick=()=>{$('#agent').checked=!$('#agent').checked;$('#agent').onchange({target:$('#agent')})};
// settings modal
const setDlg=$('#settings');
$('#setBtn').onclick=()=>setDlg.classList.add('open');
$('#setClose').onclick=()=>setDlg.classList.remove('open');
setDlg.onclick=e=>{if(e.target===setDlg)setDlg.classList.remove('open')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')setDlg.classList.remove('open')});
// sidebar: collapsible on wide screens, slide-over on phones
const app=$('#app'),narrow=()=>matchMedia('(max-width:760px)').matches;
if(S.get('side','1')==='0')app.classList.add('collapsed');
function toggleSide(){if(narrow())app.classList.toggle('sideopen');else{app.classList.toggle('collapsed');S.set('side',app.classList.contains('collapsed')?'0':'1')}}
$('#sideBtn').onclick=toggleSide;$('#sideBtn2').onclick=toggleSide;$('#scrim').onclick=()=>app.classList.remove('sideopen');
// theme: follows the OS until you pick one
const applyTheme=t=>{if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme};
applyTheme(S.get('theme',''));
$('#themeBtn').onclick=()=>{const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  const t=dark?'light':'dark';S.set('theme',t);applyTheme(t)};
function freshChat(){stop();newChat();msgs=[];lastPrompt=0;busy=false;ctrl=null;send.textContent='Send';send.classList.remove('stop');hello();renderHistory();app.classList.remove('sideopen');inp.focus()}
$('#newBtn').onclick=freshChat;
const toolOn=n=>S.get('tool.'+n,'1')==='1';
const enabledTools=()=>TOOLS.filter(t=>toolOn(t.name));

fetch('/props').then(r=>r.json()).then(p=>{
  const name=(p.model_alias||p.model_path||'').split('/').pop();
  const ctx=p.default_generation_settings?.n_ctx;NCTX=ctx||0;VISION=!!p.modalities?.vision;
  $('#model').textContent=name+(ctx?` · ctx ${ctx}`:'')+(p.modalities?.vision?' · vision':'');
}).catch(()=>$('#model').textContent='llama unreachable');
fetch('/api/tools').then(r=>r.json()).then(d=>{
  TOOLS=d.tools||[];DEFAULT_DIR=d.cwd||'';if(!msgs.length)setCwd(DEFAULT_DIR);SYSINFO=d.system||'';$('#sysInfo').textContent='System: '+(SYSINFO||'not reported by lchat-web');
  const ts=$('#toolset');ts.innerHTML=TOOLS.length?'Tools:':'Tools disabled by server';
  for(const t of TOOLS){const l=document.createElement('label');l.innerHTML=`<input type="checkbox" ${toolOn(t.name)?'checked':''}> ${t.name}${t.approval?' ⚠':''}`;
    l.querySelector('input').onchange=e=>{S.set('tool.'+t.name,e.target.checked?'1':'0');pill()};ts.appendChild(l)}
  pill();
}).catch(()=>{});

function agentPrompt(){
  const d=new Date();
  return `You are lchat, a capable assistant running locally on the user's computer. Today is ${d.toDateString()}, local time ${d.toLocaleTimeString()}. Working directory: ${CWD}. bash runs there and remembers cd for the rest of this chat; read_file and write_file resolve relative paths from it. When the task is about a project or folder somewhere else, cd into it first (or use absolute paths); do not cd around without a reason.
System: ${SYSINFO||'unknown (lchat-web did not report it)'}
Write commands for THIS system: use its native package manager and the tools listed as installed, respect its notes (for example a read-only root filesystem), and when a help card shows per-distro variants pick the one for this system's family.
You can call tools to act on the machine and the web: run bash commands, read and write files, search and fetch web pages, list/focus/minimize/close desktop windows, and take screenshots (which you can see). You also remember past conversations with the user: use the recall tool when they refer to something from before. For any Linux command-line, scripting or system task and for any error message, call linux_help FIRST: it returns verified step-by-step cards with exact commands; build your commands and scripts from them (replace <PLACEHOLDERS> with real values) instead of guessing.
Work step by step: call a tool, look at the result, then decide the next step. Do not list the home directory (ls ~) to orient yourself: the System line and the request already give the context; start with the command that tests the exact path, unit, file or error named in the request. Prefer one tool call at a time. For web research make ONE web_search call that lists several differently worded queries in its queries array. Image links from a search are only links: call download on an image before you describe it, and never describe an image you have not seen. Never guess facts you can check with a tool. If a tool fails, read the error and try a different approach. When the task is done, give a short, direct final answer without calling more tools.`;
}

// ---------- loop guard: the same tool call twice in one turn is not run again ----------
function parseArgs(c){try{return c.function.arguments?JSON.parse(c.function.arguments):{}}catch(e){return null}}
function normCmd(cmd){   // drop the noise a looping model varies: redirections, head/tail limits, || fallbacks
  return String(cmd||'').replace(/\s+\|\|\s*(echo\b[^|;&]*|true|:)\s*$/,'').replace(/\s*\d?>&\d|\s*\d?>\s*\/dev\/null/g,'')
    .replace(/\s*\|\s*(head|tail)(\s+-n)?\s+-?\d+/g,'').replace(/\s+/g,' ').replace(/[;\s]+$/,'').trim();
}
function callKey(c){
  const a=parseArgs(c);if(a===null)return null;
  const n=c.function.name;
  if(n==='bash')return n+':'+normCmd(a.command);
  const o={};for(const k of Object.keys(a).sort())o[k]=a[k];
  return n+':'+JSON.stringify(o);
}
const toks=k=>new Set(k.toLowerCase().split(/[^a-z0-9_.\/-]+/).filter(Boolean));
// a bare listing of the home directory as the first step of a turn (the model's habit to "orient itself")
const HOME_LS=/^\s*ls(\s+-[a-zA-Z]+)*\s*(~\/?|\$HOME\/?|\/home\/[^\/\s]+\/?|\.\/?)?\s*$/;
function similar(a,b){const A=toks(a),B=toks(b);let i=0;for(const x of A)if(B.has(x))i++;return i/Math.max(1,A.size+B.size-i)}
const clipRes=t=>{t=String(t);return t.length>1500?t.slice(0,1000)+'\n…\n'+t.slice(-400):t};

// ---------- minimal safe markdown ----------
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function inline(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>')}
function md(src){
  const parts=src.split(/```/);let out='';
  parts.forEach((p,i)=>{
    if(i%2){const nl=p.indexOf('\n');out+='<pre><code>'+esc(nl<0?p:p.slice(nl+1))+'</code></pre>';return}
    for(const block of p.split(/\n{2,}/)){
      const lines=block.split('\n').filter(l=>l.trim()!=='');if(!lines.length)continue;
      if(lines.every(l=>/^\s*([-*]|\d+\.)\s+/.test(l))){
        const tag=/^\s*\d+\./.test(lines[0])?'ol':'ul';
        out+=`<${tag}>`+lines.map(l=>'<li>'+inline(l.replace(/^\s*([-*]|\d+\.)\s+/,''))+'</li>').join('')+`</${tag}>`;
      }else if(/^#{1,4}\s/.test(lines[0])&&lines.length===1){out+='<h3>'+inline(lines[0].replace(/^#+\s/,''))+'</h3>'}
      else out+='<p>'+lines.map(inline).join('<br>')+'</p>';
    }
  });
  return out;
}

// ---------- input / attachments ----------
function add(role,html){const d=document.createElement('div');d.className='msg '+role;d.innerHTML=html;log.appendChild(d);scroll(true);return d}
let stuck=true;log.onscroll=()=>{stuck=log.scrollHeight-log.scrollTop-log.clientHeight<40};
function scroll(force){if(force||stuck)log.scrollTop=log.scrollHeight}
function renderAtt(){att.innerHTML='';imgs.forEach((u,i)=>{const a=document.createElement('div');a.className='a';a.innerHTML=`<img src="${u}"><span>×</span>`;a.querySelector('span').onclick=()=>{imgs.splice(i,1);renderAtt()};att.appendChild(a)})}
function addFiles(files){for(const f of files){if(!f.type.startsWith('image/'))continue;const r=new FileReader();r.onload=()=>{imgs.push(r.result);renderAtt()};r.readAsDataURL(f)}}
$('#clip').onclick=()=>$('#file').click();$('#file').onchange=e=>{addFiles(e.target.files);e.target.value=''};
inp.addEventListener('paste',e=>{const f=[...e.clipboardData.files];if(f.length){e.preventDefault();addFiles(f)}});
const box=$('#box');box.ondragover=e=>{e.preventDefault();box.classList.add('drag')};box.ondragleave=()=>box.classList.remove('drag');
box.ondrop=e=>{e.preventDefault();box.classList.remove('drag');addFiles(e.dataTransfer.files)};
inp.oninput=()=>{inp.style.height='auto';inp.style.height=inp.scrollHeight+'px'};
inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!busy)go()}};
send.onclick=()=>busy?stop():go();
function stop(){if(ctrl)ctrl.abort();for(const r of pendingAsks.splice(0))r(false)}

// ---------- one streamed model call ----------
async function streamStep(req,wrap){
  const seg=document.createElement('div');
  seg.innerHTML='<details class="think" hidden><summary>Thinking…</summary><div></div></details><div class="body"></div>';
  wrap.insertBefore(seg,wrap.querySelector('.meta'));
  const th=seg.querySelector('.think'),thd=th.querySelector('div'),body=seg.querySelector('.body');
  const t0=performance.now();let out='',reason='',calls=[],usage=null,timings=null,finish=null;
  const r=await fetch('/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(req),signal:ctrl.signal});
  if(!r.ok)throw new Error((await r.text()).slice(0,500));
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
  try{
    for(;;){
      const {value,done}=await rd.read();
      buf+=done?dec.decode()+'\n':dec.decode(value,{stream:true});
      let i;while((i=buf.indexOf('\n'))>=0){
        const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
        if(!line.startsWith('data: ')||line==='data: [DONE]')continue;
        const ev=JSON.parse(line.slice(6));
        if(ev.error)throw new Error(ev.error.message||JSON.stringify(ev.error));
        if(ev.usage)usage=ev.usage;if(ev.timings)timings=ev.timings;
        const ch=ev.choices?.[0];if(!ch)continue;
        if(ch.finish_reason)finish=ch.finish_reason;
        const d=ch.delta||{};
        const rc=d.reasoning_content||d.reasoning;
        if(rc){reason+=rc;th.hidden=false;thd.textContent=reason;if(!out)th.open=true}
        if(d.content){out+=d.content;if(th.open&&reason)th.open=false;body.innerHTML=md(out)}
        for(const tc of d.tool_calls||[]){
          const k=tc.index??(tc.id||!calls.length?calls.length:calls.length-1);calls[k]??={id:'',type:'function',function:{name:'',arguments:''}};
          if(tc.id)calls[k].id=tc.id;if(tc.function?.name)calls[k].function.name+=tc.function.name;
          if(tc.function?.arguments)calls[k].function.arguments+=tc.function.arguments;
        }
        scroll();
      }
      if(done)break;
    }
  }finally{
    if(reason){th.open=false;th.querySelector('summary').textContent=`Thought (${((performance.now()-t0)/1000).toFixed(1)}s)`}
  }
  calls=calls.filter(Boolean);
  calls.forEach((c,i)=>{if(!c.id)c.id='call_'+Date.now()+'_'+i});
  return {out,reason,calls,usage,timings,finish,seg};
}

// ---------- tool card + execution ----------
function argSummary(name,args){
  if(name==='bash')return args.command||'';
  if(name==='screenshot')return args.target||'screen';
  if(name==='window_action')return `${args.action} · ${args.window}`;
  if(name==='web_search')return [].concat(args.queries||[],args.query||[]).join(' | ')+(args.images?' + images':'');
  if(name==='download'||name==='web_fetch')return args.url||'';
  return Object.values(args).map(v=>typeof v==='string'?v:JSON.stringify(v)).join(' · ');
}
async function runTool(call,wrap,skip){
  const name=call.function.name;let args={};
  const card=document.createElement('div');card.className='tool';
  card.innerHTML=`<div class="hd"><span class="nm"></span><span class="sum"></span><span class="st run">…</span></div><div class="bd"><pre class="args"></pre><div class="res"></div></div>`;
  wrap.insertBefore(card,wrap.querySelector('.meta'));
  card.querySelector('.hd').onclick=()=>card.classList.toggle('open');
  const st=card.querySelector('.st'),res=card.querySelector('.res');
  card.querySelector('.nm').textContent=name;
  const done=(text,cls,lbl)=>{st.className='st '+cls;st.textContent=lbl;return text};
  try{args=call.function.arguments?JSON.parse(call.function.arguments):{}}
  catch(e){card.querySelector('.args').textContent=call.function.arguments;return {text:done(`error: arguments are not valid JSON (${e.message}). Call the tool again with a valid JSON object.`,'err','bad args')}}
  card.querySelector('.sum').textContent=argSummary(name,args);
  card.querySelector('.args').textContent=name==='bash'?args.command:JSON.stringify(args,null,2);
  if(skip)return {text:done(skip,'err','repeat, not run'),repeat:true};
  const meta=TOOLS.find(t=>t.name===name);
  if(!meta||!toolOn(name))return {text:done(`error: tool "${name}" is not available.`,'err','unavailable')};
  const SENSITIVE=/(^|\/)(\.ssh|\.gnupg|\.aws|\.kube|\.password-store|\.mozilla|\.config\/(google-chrome|chromium)|\.local\/share\/keyrings)(\/|$)|\.env$|\.pem$|\.key$|id_[a-z0-9]+$|token|secret|passw|auth\.json$|\/proc\/[^/]+\/environ/i;
  const risky=(meta.approval&&!(name==='window_action'&&args.action!=='close'))||(name==='read_file'&&SENSITIVE.test(args.path||''));
  if(ctrl.signal.aborted)throw new DOMException('aborted','AbortError');
  if(risky&&(!$('#auto').checked||meta.approval==='always')){   // 'always': asks even with auto-approve on
    st.textContent='needs approval';card.classList.add('open','asking');if(curPhase)curPhase.extra=' — waiting for your approval';
    const ask=document.createElement('div');ask.className='ask';
    ask.innerHTML='<span style="flex:1">Run this?</span><button class="btn pri">Run</button><button class="btn">Deny</button>';
    card.appendChild(ask);scroll(true);
    const ok=await new Promise(resolve=>{pendingAsks.push(resolve);
      const [y,n]=ask.querySelectorAll('button');y.onclick=()=>resolve(true);n.onclick=()=>resolve(false)});
    ask.remove();card.classList.remove('asking');if(curPhase)curPhase.extra='';
    if(ctrl.signal.aborted)throw new DOMException('aborted','AbortError');
    if(!ok)return {text:done('The user denied this tool call. Do not retry it; ask the user or take another approach.','err','denied'),denied:true};
  }
  st.textContent='running…';
  const t0=performance.now();
  let r;
  try{
    r=await (await fetch('/api/tool',{method:'POST',headers:{'Content-Type':'application/json','X-LChat-Token':TOKEN},body:JSON.stringify({name,args,session:CHAT_ID,chat:CHAT_ID}),signal:ctrl.signal})).json();
  }catch(e){if(e.name==='AbortError')throw e;r={text:'error: '+e.message,error:true}}
  const secs=((performance.now()-t0)/1000).toFixed(1)+'s';
  const pre=document.createElement('pre');pre.textContent=r.text;res.appendChild(pre);
  if(r.image){const im=document.createElement('img');im.src=r.image;res.appendChild(im);card.classList.add('open')}
  done('',r.error?'err':'ok',(r.error?'error · ':'✓ ')+secs);scroll();
  return r;
}

// ---------- context budget ----------
// Send the model only the newest image; shrink old tool outputs when the last
// prompt used most of the context window. msgs itself is never modified.
function fitContext(list,lastPrompt){
  let lastImg=-1;
  list.forEach((m,i)=>{if(Array.isArray(m.content)&&m.content.some(c=>c.type==='image_url'))lastImg=i});
  const tight=NCTX&&lastPrompt>NCTX*0.6;
  const keepTail=6; // most recent messages stay untouched
  return list.map((m,i)=>{
    let c=m.content;
    if(Array.isArray(c)&&(i!==lastImg||!VISION)&&c.some(x=>x.type==='image_url'))
      c=c.map(x=>x.type==='image_url'?{type:'text',text:'[older image removed to save context]'}:x);
    if(tight&&m.role==='tool'&&i<list.length-keepTail&&typeof c==='string'&&c.length>800)
      c=c.slice(0,500)+`\n…[${c.length-500} chars of old tool output removed to save context]`;
    if(tight&&m.role==='assistant'&&m.reasoning_content&&i<list.length-keepTail){const {reasoning_content,...rest}=m;return {...rest,content:c}}
    return c===m.content?m:{...m,content:c};
  });
}

// ---------- agent loop ----------
async function go(){
  const text=inp.value.trim();if(!text&&!imgs.length)return;
  if(window.lchat.onSend&&window.lchat.onSend(text,CHAT_ID)===true){inp.value='';inp.oninput();return}   // e.g. task threads
  $('#hello')?.remove();
  let sendImgs=imgs;
  if(imgs.length&&!VISION){sendImgs=[]}
  const content=sendImgs.length?[...sendImgs.map(u=>({type:'image_url',image_url:{url:u}})),{type:'text',text}]:text;
  const userEl=add('user','<div class="body">'+imgs.map(u=>`<img src="${u}">`).join('')+esc(text)+'</div>');
  const H=msgs;               // this turn's history; New chat swaps msgs and orphans H
  H.push({role:'user',content});inp.value='';inp.oninput();const sentImgs=imgs;imgs=[];renderAtt();
  const wrap=add('asst','<div class="meta"></div><ul class="phases"></ul><div class="state run" hidden>working…</div>'),meta=wrap.querySelector('.meta'),stateEl=wrap.querySelector('.state'),phasesEl=wrap.querySelector('.phases');
  const turnT0=performance.now();
  // progress list (like Claude Code): one line per phase, live spinner + elapsed time, then ✓ / ✕
  const VERBS=['Thinking','Pondering','Reasoning','Mulling','Working out','Considering','Puzzling','Cogitating'];
  curPhase=null;
  const phase=(label,verb=false)=>{const li=document.createElement('li');li.className='run';phasesEl.appendChild(li);
    const t0=performance.now(),v=VERBS[Math.floor(Math.random()*VERBS.length)];
    const draw=()=>{const s=((performance.now()-t0)/1000).toFixed(0);li.textContent=(verb?`${v}… `:'')+label+` · ${s}s`+(ph.extra||'')};
    const ph={li,extra:'',end(text,cls='ok'){clearInterval(iv);li.className=cls;
      li.textContent=(text??label)+` (${((performance.now()-t0)/1000).toFixed(1)}s)`;if(curPhase===ph)curPhase=null}};
    draw();const iv=setInterval(draw,1000);curPhase=ph;scroll();return ph};
  // while the turn runs the progress list says what is happening; the state line only shows the outcome
  const setState=(t,cls='run')=>{stateEl.className='state '+cls;stateEl.textContent=t;stateEl.hidden=cls==='run';
    document.title=(cls==='run'?'● ':(document.hidden?'✓ ':''))+BASE_TITLE};
  const note=(t,cls='err')=>wrap.insertBefore(Object.assign(document.createElement('p'),{className:cls,textContent:t}),meta);
  if(sentImgs.length&&!VISION)note('Image not sent: the loaded model has no vision support (start llama with --mmproj).');
  busy=true;ctrl=new AbortController();send.textContent='Stop';send.classList.add('stop');
  const agent=$('#agent').checked&&enabledTools().length;
  const maxSteps=Math.max(1,+$('#steps').value||20);
  let tin=0,tout=0,steps=0,tps=null;
  const turnStart=H.length;
  const seen=[];let repeats=0,nudges=0,dry=0,forceAnswer=false,forced=false;   // nudges: corrective follow-ups this turn (max 2)   // loop guard state for this turn: {key,step,text}
  let endState=['done','ok'];
  saveChat(H);                   // the chat shows up in History right away
  // auto-retrieval: a small model rarely calls linux_help on its own, so look the request up once per user turn
  // and put the best cards into this turn's system prompt (only when they clearly match)
  let helpCards='';
  // small talk ("hello", "thanks") has nothing to look up
  // "how to ..." is a question, not a task: explain with the exact commands, ask for missing values, ask before
  // running. For such a turn the tools that change the machine are not offered at all.
  const howTo=/^\s*(how\s+(to|do\s+i|can\s+i|do\s+you|would\s+i|should\s+i)\b|what('?s|\s+is)\s+the\s+(command|way)\b|which\s+command\b|как\s|каким\s+образом|какой\s+командой|какая\s+команда)/i.test(text);
  const ACT_TOOLS=new Set(['bash','write_file','window_action']);
  const smallTalk=/^\s*(hi|hello|hey|yo|thanks|thank you|thx|ok|okay|yes|no|good (morning|evening|night)|bye|привет|здравствуй\S*|спасибо|ок|да|нет|пока)[\s!.,?)]*$/i.test(text)
    ||(text.trim().split(/\s+/).length<3&&!/[\/|$~<>=_.-]|\d/.test(text));

  const curTask=()=>TASKS&&String(CHAT_ID).startsWith('task-')?(TASKS.tasks.find(t=>t.chat_id===CHAT_ID)||null):null;
  const sameDay=(a,b)=>a.toDateString()===b.toDateString();
  // epoch s -> "HH:MM", with a short weekday in front when it is not today
  function tTime(s){
    const d=new Date(s*1000),t=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    return sameDay(d,new Date())?t:d.toLocaleDateString([],{weekday:'short'})+' '+t;
  }
  // dot class: run | ok | bad | warn | paused | never
  function tState(t){
    if(t.running||t.queued)return 'run';
    if(!t.enabled)return 'paused';
    switch(t.last_status){
      case 'ok':return 'ok';
      case 'stopped':return 'warn';
      case 'error':case 'denied':case 'missed':case 'interrupted':return 'bad';
      default:return 'never';
    }
  }
  function tRight(t){
    if(t.running)return 'running…';
    if(t.queued)return 'queued';
    if(!t.enabled)return 'paused';
    return t.next_run?tTime(t.next_run):'';
  }
  // ---- data ----
  async function tAct(what,id,quiet){
    let d;try{d=await api('/api/tasks/'+what,{id})}catch{d={error:'network error'}}
    if(d&&d.error&&!quiet)alert(d.error);
    tLoad();
    return d;
  }
  async function tLoad(){
    if(tBusy){tAgain=true;return}
    tBusy=true;
    let d=null;try{d=await api('/api/tasks')}catch{d=null}
    tBusy=false;
    applyTasks(d);
    if(tAgain){tAgain=false;return tLoad()}
    const fast=!!TASKS&&(TASKS.tasks.some(t=>t.running||t.queued)||!bar.hidden);
    clearTimeout(tTimer);tTimer=setTimeout(tLoad,fast?5000:30000);
  }
  function applyTasks(d){
    TASKS=d&&!d.error&&Array.isArray(d.tasks)?d:null;
    let reopen=null;
    if(TASKS){
      for(const t of TASKS.tasks){
        const p=prevRun[t.id];
        if(p&&(p.running&&!t.running||p.run_count!==t.run_count||p.last_run!==t.last_run)){
          const c=curTask();if(c&&c.id===t.id)reopen=c.chat_id;   // the open task just finished a run
        }
        prevRun[t.id]={running:!!t.running,run_count:t.run_count,last_run:t.last_run};
      }
    }
    renderNav();renderBar();
    if(reopen)setTimeout(()=>{if(CHAT_ID===reopen)window.lchat.openChat(reopen)},0);
  }
  // ---- sidebar ----
  function renderNav(){
    if(!TASKS){nav.hidden=true;nav.innerHTML='';return}
    nav.hidden=false;nav.innerHTML='';
    const list=TASKS.tasks;
    const hd=document.createElement('div');hd.className='tkh';
    hd.innerHTML='<span>Tasks</span><span class="n"></span><button class="ibtn tkplus" title="New task">+</button>';
    hd.querySelector('.n').textContent=list.length?String(list.length):'';
    hd.querySelector('.tkplus').onclick=()=>openDlg(null);
    nav.appendChild(hd);
    if(!TASKS.engine){const m=document.createElement('div');m.className='tkmut';m.textContent='scheduler off'+(TASKS.status?' · '+TASKS.status:'');nav.appendChild(m)}
    if(!list.length&&TASKS.engine){const m=document.createElement('div');m.className='tkmut';m.textContent='no tasks yet';nav.appendChild(m)}
    for(const t of list){
      const r=document.createElement('div');
      r.className='tkrow'+(t.chat_id&&t.chat_id===CHAT_ID?' cur':'');
      r.title=(t.title||'')+(t.human?'\n'+t.human:'')+(t.chat_id?'':'\n(no thread yet)');
      r.innerHTML='<span class="tkdot"></span><span class="tkt"></span><span class="tkw"></span><span class="tkub" hidden></span>';
      r.querySelector('.tkdot').classList.add(tState(t));
      r.querySelector('.tkt').textContent=t.title||'untitled';
      r.querySelector('.tkw').textContent=tRight(t);
      if(t.unread>0){const ub=r.querySelector('.tkub');ub.hidden=false;ub.textContent=t.unread}
      r.onclick=()=>openTask(t);
      nav.appendChild(r);
    }
  }
  async function openTask(t){
    app.classList.remove('sideopen');
    if(!t.chat_id){openDlg(t);return}
    await window.lchat.openChat(t.chat_id);
    tAct('seen',t.id,true);
  }
  // ---- bar above a task thread ----
  function tNote(msg,bad){
    barNote=msg;barBad=!!bad;clearTimeout(noteTimer);
    noteTimer=setTimeout(()=>{barNote='';renderBar()},4000);
    renderBar();
  }
  function renderBar(){
    const t=curTask();
    if(!t){bar.hidden=true;barKey='';bar.innerHTML='';return}
    const run=!!(t.running||t.queued);
    let info=`⏱ ${E(t.human||t.spec)}`;
    if(t.running)info+=' · <span class="cbrun">running…</span>';
    else if(t.queued)info+=' · <span class="cbrun">queued</span>';
    else if(!t.enabled)info+=' · paused';
    else if(t.next_run)info+=' · next '+E(tTime(t.next_run));
    info+=' · last '+E(t.last_status||'never')+' · access <span class="cbx '+E(t.access)+'">'+E(t.access||'web')+'</span>';
    let btns=`<button class="btn" data-a="run"${run?' disabled':''}>Run now</button>`
      +`<button class="btn" data-a="toggle">${t.enabled?'Pause':'Resume'}</button>`
      +(t.running?'<button class="btn" data-a="stop">Stop</button>':'')
      +'<button class="btn" data-a="edit">Edit</button><button class="btn" data-a="delete">Delete</button>';
    const note=barNote?`<span class="cbn${barBad?' bad':''}">${E(barNote)}</span>`:'';
    const key=info+'|'+btns+'|'+note;
    bar.hidden=false;
    if(key===barKey)return;   // unchanged: keep the DOM (and any hover/focus) as it is
    barKey=key;
    bar.innerHTML=`<span class="cbi">${info}</span><span class="cbb">${btns}</span>${note}`;
  }
  bar.onclick=e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)barAct(b.dataset.a)};
  async function barAct(a){
    const t=curTask();if(!t)return;
    if(a==='run')tAct('run',t.id);
    else if(a==='toggle')tAct(t.enabled?'pause':'resume',t.id);
    else if(a==='stop')tAct('stop',t.id);
    else if(a==='edit')openDlg(t);
    else if(a==='delete'){
      if(!confirm(`Delete task "${t.title||''}"?`))return;
      const d=await tAct('delete',t.id);
      if(d&&!d.error)freshChat();
    }
  }
  // ---- questions typed in a task thread go to the task ----
  window.lchat.onSend=(text,chatId)=>{
    if(!String(chatId).startsWith('task-'))return false;
    const t=TASKS&&TASKS.tasks.find(x=>x.chat_id===chatId);
    if(!t)return false;
    api('/api/tasks/ask',{id:t.id,text}).then(d=>{
      if(!d||d.error){
        tNote(d&&d.error||'not sent',true);
        if(CHAT_ID===chatId&&!inp.value){inp.value=text;inp.oninput()}   // give the text back
      }else tNote('question queued');
      tLoad();
    }).catch(()=>{tNote('not sent (network error)',true);if(CHAT_ID===chatId&&!inp.value){inp.value=text;inp.oninput()}});
    return true;
  };
  // ---- New / Edit dialog ----
  const dlg=document.createElement('div');dlg.id='taskDlg';
  dlg.innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="tkDlgT">
    <div class="tkhd"><h2 id="tkDlgT">New task</h2><button class="ibtn" data-x title="Close">✕</button></div>
    <label class="tkf"><span class="tkl">Title</span><input id="tkName" maxlength="120" autocomplete="off"></label>
    <label class="tkf"><span class="tkl">Prompt</span><textarea id="tkPrompt"></textarea></label>
    <div class="tkf"><span class="tkl">Schedule</span>
      <input id="tkSched" placeholder="every 15 min, daily 09:00, weekdays 08:30" autocomplete="off">
      <div class="tkchips">
        <button class="tkch" type="button" data-s="every 15 min">every 15 min</button>
        <button class="tkch" type="button" data-s="hourly">hourly</button>
        <button class="tkch" type="button" data-s="daily 09:00">daily 09:00</button>
        <button class="tkch" type="button" data-s="weekdays 08:30">weekdays 08:30</button>
      </div>
      <div id="tkPrev" class="tkprev"></div></div>
    <fieldset class="tkf tkacc"><legend>Access</legend>
      <label><input type="radio" name="tkAcc" value="web" checked> <b>web</b> <small>web_search, web_fetch, linux_help</small></label>
      <label><input type="radio" name="tkAcc" value="read"> <b>read</b> <small>local only, no web: read_file, list_windows, screenshot, system_facts, linux_help</small></label>
      <label><input type="radio" name="tkAcc" value="full"> <b>full</b> <small>web + read + bash, write_file, download, window_action, recall</small></label>
      <div id="tkWarn" class="tkwarn" hidden>Full access runs commands unattended; content from web pages can steer them.</div>
    </fieldset>
    <div id="tkErr" class="tkerr" hidden></div>
    <div class="tkfoot"><span class="tkmut">Tasks run only while lchat is running.</span>
      <button class="btn" id="tkCancel" type="button">Cancel</button>
      <button class="btn pri" id="tkSave" type="button">Save</button></div>
  </div>`;
  document.body.appendChild(dlg);
  const q=s=>dlg.querySelector(s);
  let tdEdit=null,pvTimer=0,pvSeq=0;
  const accVal=()=>{const r=dlg.querySelector('input[name=tkAcc]:checked');return r?r.value:'web'};
  function accChanged(){q('#tkWarn').hidden=accVal()!=='full'}
  function schedPreview(){
    clearTimeout(pvTimer);
    const s=q('#tkSched').value.trim(),out=q('#tkPrev'),seq=++pvSeq;
    out.className='tkprev';
    if(!s){out.textContent='Enter a schedule.';return}
    out.textContent='…';
    pvTimer=setTimeout(async()=>{
      let d;try{d=await api('/api/tasks/preview',{schedule:s})}catch{d={error:'preview failed (network error)'}}
      if(seq!==pvSeq)return;   // a newer input is in flight
      out.className='tkprev';out.textContent='';
      if(d&&!d.error){
        const h=document.createElement('div');h.className='tkok';h.textContent=d.human||d.spec||'';
        const n=document.createElement('div');n.className='tkmut';
        n.textContent='next: '+(d.next_runs||[]).slice(0,3).map(x=>tTime(x)).join(', ');
        out.append(h,n);
      }else{out.className='tkprev bad';out.textContent=(d&&d.error)||'invalid schedule'}
    },300);
  }
  function openDlg(t){
    tdEdit=t?t.id:null;
    q('#tkDlgT').textContent=t?'Edit task':'New task';
    q('#tkName').value=t?t.title||'':'';
    q('#tkPrompt').value=t?t.prompt||'':'';
    q('#tkSched').value=t?(t.human||''):'';
    const acc=t?t.access||'web':'web';
    dlg.querySelectorAll('input[name=tkAcc]').forEach(r=>{r.checked=r.value===acc});
    accChanged();
    q('#tkErr').hidden=true;
    dlg.classList.add('open');
    schedPreview();
    setTimeout(()=>q('#tkName').focus(),0);
  }
  function closeDlg(){clearTimeout(pvTimer);pvSeq++;dlg.classList.remove('open')}
  async function saveDlg(){
    const title=q('#tkName').value.trim(),prompt=q('#tkPrompt').value.trim(),schedule=q('#tkSched').value.trim(),access=accVal();
    const err=q('#tkErr');
    if(!title||!prompt||!schedule){err.hidden=false;err.textContent='Title, prompt and schedule are required.';return}
    const save=q('#tkSave');save.disabled=true;
    let d;
    try{d=await api(tdEdit?'/api/tasks/update':'/api/tasks/create',tdEdit?{id:tdEdit,title,prompt,schedule,access}:{title,prompt,schedule,access})}
    catch{d={error:'network error'}}
    save.disabled=false;
    if(d&&d.error){err.hidden=false;err.textContent=d.error;return}
    closeDlg();tLoad();
  }
  dlg.onclick=e=>{if(e.target===dlg)closeDlg()};
  q('[data-x]').onclick=closeDlg;
  q('#tkCancel').onclick=closeDlg;
  q('#tkSave').onclick=saveDlg;
  q('#tkSched').oninput=schedPreview;
  dlg.querySelectorAll('.tkch').forEach(b=>b.onclick=()=>{q('#tkSched').value=b.dataset.s;schedPreview()});
  dlg.querySelectorAll('input[name=tkAcc]').forEach(r=>r.onchange=accChanged);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dlg.classList.contains('open'))closeDlg()});
  // ---- argSummary for the scheduler tools ----
  const _as=argSummary;
  argSummary=(n,a)=>{a=a||{};return n==='schedule_task'?`${a.title||''} · ${a.schedule||''} · access ${a.access||'web'}`:n==='manage_task'?`${a.action||''} ${a.task||''}`:_as(n,a)};
  // ---- refresh: setTimeout chain (5 s while busy or a bar is shown, else 30 s); refresh on chat change and actions ----
  document.addEventListener('lchat:chatopen',()=>{renderNav();renderBar();tLoad()});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)tLoad()});
  tLoad();
})();
// ===== end tasks =====
</script>
</body>
</html>
